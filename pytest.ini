[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src
addopts = -v --tb=short

# Markers
markers =
    unit: fast, isolated unit tests (no browser, no network)
    e2e: end-to-end tests that require a browser (Playwright)
    slow: tests that take more than a few seconds
